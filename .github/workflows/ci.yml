name: gate

# D2 `both`: local checks for speed, CI as the authority that cannot be skipped.
# D3 `builddet`: this job runs exactly what scripts/gate.sh runs, nothing more.
#
# Deliberately absent: any cross-architecture job. B5 rules `xarch`, but no qemu
# step exists yet — a workflow that claimed one would be a check that cannot
# fail, which is worse than a declared gap.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  builddet:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a 40-hex commit, not a movable tag: `@v4` can be repointed under us,
      # and a workflow that silently changes what it runs is a check you cannot trust.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: toolchain (matches rust-toolchain.toml)
        run: rustup show active-toolchain

      # Citation integrity needs only the tree, so it can run here; smoke.sh
      # cannot, because it reads evidence that deliberately lives outside the
      # repo. Same script, so there is one copy of the rule.
      - name: citations
        run: python3 scripts/check_citations.py

      - name: gate
        run: ./scripts/gate.sh
